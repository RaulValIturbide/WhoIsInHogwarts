<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Daily Hogwarts guessing game. Try to guess which Harry Potter character appears today in this magical interactive experience.">
    <meta name="keywords" content="Hogwarts, Harry Potter, web game, guessing game, fun, daily challenge, wizarding world, magic, characters">
    <meta name="author" content="Raúl Val Iturbide">
    <meta name="robots" content="index, follow">

    <!-- Esto es para Open Graph-->
    <meta property="og:type" content="website"> 
    <meta property="og:title" content="Who is in Hogwarts Today?"> 
    <meta property="og:description" content="Today’s character is a mystery… can you guess who it is?"> 
    <meta property="og:url" content="https://whoisinhogwartstoday.com"> 
    <meta property="og:image" content="https://whoisinhogwartstoday.com/img/hogwartsFondo.png">

    <!-- Especifico para twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Who is in Hogwarts Today?">
    <meta name="twitter:description" content="Today’s character is a mystery… can you guess who it is?">
    <meta name="twitter:image" content="https://whoisinhogwartstoday.com/img/hogwartsFondo.png">


    <link rel="stylesheet" href="css/style.css"/>
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">

    <title>WIIHT-Who Is In Hogwarts Today?</title>
</head>
<body>
    <img src="img/hogwartsFondo.png" class="fondo">

    <div class="LinksSociales">
        <a href="https://x.com/WhoIsInHogwarts" target="_blank">
        <img id="RedSocialX" src="img/logoRedSocialX.png">
        </a>
    </div>

    <div class="opciones">
        <img id="IdiomaSpain" src="img/SpainFlag.svg">
        <img id="IdiomaEnglish" src="img/EnglishFlag.png">
        <img id="AjustesCamaraSecreta" src="img/Ajustes_CamaraSecretaSimbolo.png">
    </div>

    <!-- PoP UP para el login/registro-->
    <div class="Login" id="Caja_Login">
        <div class="modal-inner">
            <button id="Close_Login" aria-label="Cerrar">✕</button>
            <div class="modal-tabs">
                <button class="tab-btn active" data-tab="login">Iniciar sesión</button>
                <button class="tab-btn" data-tab="register">Registrarse</button>
            </div>

            <!-- Login -->
            <div class="tab-content active" id="tab-login">
                <h2>Bienvenido de nuevo</h2>
                <form id="form-login">
                    <label>Email</label>
                    <input type="email" placeholder="tu@email.com" required>
                    <label>Contraseña</label>
                    <div class="input-pass">
                        <input type="password" placeholder="••••••••" required>
                        <button type="button" class="btn-ojo" aria-label="Mostrar contraseña">👁</button>
                    </div>
                    <button type="submit" class="btn-primary">Entrar</button>
                </form>
            </div>

            <!-- Registro -->
            <div class="tab-content" id="tab-register">
                <h2>Crear cuenta</h2>
                <form id="form-register">
                    <label>Nombre</label>
                    <input type="text" placeholder="Tu nombre" required>
                    <label>Email</label>
                    <input type="email" placeholder="tu@email.com" required>
                    <label>Contraseña</label>
                    <div class="input-pass">
                        <input type="password" placeholder="••••••••" required>
                        <button type="button" class="btn-ojo" aria-label="Mostrar contraseña">👁</button>
                    </div>
                    <label class="label-solemne">
                        <input type="checkbox" id="check-solemne" required>
                        <span id="texto-solemne">Juro solemnemente que mis intenciones no son buenas</span>
                    </label>
                    <button type="submit" class="btn-primary">Registrarse</button>
                </form>
            </div>
        </div>
    </div>

    <h1 class="titulo">Who is Prowling Around Hogwarts Tonight?</h1>
    <div class="huellas"></div>

    <div class="bloqueResultados"> 
        <!-- Aquí insertaremos el encabezado --> 
        <div class="encabezadoTabla fila"></div>
        <!-- Aquí van los intentos --> 
        <div class="scrollResultados"></div>
    </div>

    <div class="bloque">
        <div class="buscador-fila">
            <input type="text" class="buscador" placeholder="Escribe el nombre de un personaje">
            <button id="btn-dados" title="Probar suerte">🎲</button>
        </div>
        <div class="resultados"></div>
    </div>

    <div class="CromoPersonajeSecreto">
        <button id="btn-cerrar-cromo">✕</button>
        <img id="imgCromo">
        <div class="CajaAcierto"></div>
        <div id="cromo-intentos"></div>
        <div id="cromo-mensaje-coleccion"></div>
        <button id="btn-ver-album" style="display:none;margin-top:10px;width:100%;background:linear-gradient(135deg,#5c3a1e,#8a5c2a);color:#f5e6c8;border:1px solid #c9a87a;border-radius:6px;padding:7px;font-size:12px;font-family:Georgia,serif;cursor:pointer;letter-spacing:0.5px;"></button>
    </div>

    <!-- Album de cromos -->
    <div id="album-overlay">
        <div id="album-libro">
            <button id="album-close">x</button>
            <div class="album-header">
                <h2 class="album-titulo" id="album-titulo-texto">Merodeadores atrapados</h2>
            </div>
            <div class="album-pages">
                <div class="album-pagina">
                    <div id="album-cromos-izq" class="album-cromos-grid"></div>
                </div>
                <div class="album-lomo"></div>
                <div class="album-pagina">
                    <div id="album-cromos-der" class="album-cromos-grid"></div>
                </div>
            </div>
            <div class="album-footer">
                <button id="album-prev" class="album-nav">&#8592;</button>
                <button id="album-next" class="album-nav">&#8594;</button>
            </div>
        </div>
    </div>

    <!-- Cromo ampliado -->
    <div id="cromo-lightbox">
        <div id="cromo-lightbox-inner">
            <div id="cromo-lightbox-imagen">
                <img id="cromo-lightbox-img" src="" alt="">
                <div id="cromo-lightbox-nombre"></div>
                <div id="cromo-lightbox-intentos"></div>
                <div id="cromo-lightbox-fecha"></div>
            </div>
            <div id="cromo-lightbox-frase">
                <div id="cromo-lightbox-comillas">"</div>
                <div id="cromo-lightbox-texto"></div>
                <div id="cromo-lightbox-referencia"></div>
            </div>
        </div>
    </div>

    <!-- Logica del juego -->
    <script src="Logica/Personaje.js"></script>
    <script src="Logica/GestorPersonajes.js"></script>
    <script src="Logica/GestorIdioma.js"></script>
    <script src="Logica/GestorBusqueda.js"></script>

    <!-- Firebase -->
    <script type="module" src="firebase.js"></script>

    <!-- App principal -->
    <script type="module" src="app.js"></script>

</body>
</html>
